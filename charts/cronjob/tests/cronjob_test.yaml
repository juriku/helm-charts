suite: cronjob
templates:
  - templates/base.yaml
release:
  name: my-release
set:
  schedule: "*/5 * * * *"
  image.repository: example.com/job
  image.tag: "1.2.3"

tests:
  - it: should render a CronJob on the given schedule
    asserts:
      - isKind:
          of: CronJob
        documentSelector:
          path: kind
          value: CronJob
      - equal:
          path: spec.schedule
          value: "*/5 * * * *"
        documentSelector:
          path: kind
          value: CronJob
      - equal:
          path: metadata.name
          value: my-release
        documentSelector:
          path: kind
          value: CronJob

  - it: should label the pods it creates so they can be found
    asserts:
      - isSubset:
          path: spec.jobTemplate.spec.template.metadata.labels
          content:
            app.kubernetes.io/instance: my-release
        documentSelector:
          path: kind
          value: CronJob

  - it: should default concurrency and history limits
    asserts:
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
        documentSelector:
          path: kind
          value: CronJob
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 2
        documentSelector:
          path: kind
          value: CronJob
      - equal:
          path: spec.failedJobsHistoryLimit
          value: 2
        documentSelector:
          path: kind
          value: CronJob

  - it: should allow overriding concurrency, history and suspension
    set:
      concurrencyPolicy: Replace
      successfulJobsHistoryLimit: 5
      failedJobsHistoryLimit: 1
      suspend: true
      startingDeadlineSeconds: 120
    asserts:
      - equal:
          path: spec.concurrencyPolicy
          value: Replace
        documentSelector:
          path: kind
          value: CronJob
      - equal:
          path: spec.suspend
          value: true
        documentSelector:
          path: kind
          value: CronJob
      - equal:
          path: spec.startingDeadlineSeconds
          value: 120
        documentSelector:
          path: kind
          value: CronJob

  - it: should render the main container first inside the job template
    set:
      extraContainers:
        - name: sidecar
          image:
            tag: "1.0.0"
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].name
          value: my-release
        documentSelector:
          path: kind
          value: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[1].name
          value: sidecar
        documentSelector:
          path: kind
          value: CronJob

  - it: should render init containers at the right indentation
    set:
      initContainers:
        - name: prepare
          command: ["sh", "-c", "true"]
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].name
          value: prepare
        documentSelector:
          path: kind
          value: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].image
          value: example.com/job:1.2.3
        documentSelector:
          path: kind
          value: CronJob

  - it: should apply the container spec inside the job template
    set:
      command: ["sh", "-c"]
      args: ["report"]
      environment:
        variables:
          MODE: nightly
      resources:
        requests:
          memory: 256Mi
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          value: ["report"]
        documentSelector:
          path: kind
          value: CronJob
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: MODE
            value: nightly
        documentSelector:
          path: kind
          value: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.requests.memory
          value: 256Mi
        documentSelector:
          path: kind
          value: CronJob

  - it: should default restartPolicy to Never for the job pod
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: Never
        documentSelector:
          path: kind
          value: CronJob

  - it: should apply the restricted security preset
    set:
      securityPreset: restricted
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
        documentSelector:
          path: kind
          value: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.runAsNonRoot
          value: true
        documentSelector:
          path: kind
          value: CronJob
