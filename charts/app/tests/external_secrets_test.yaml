suite: external secrets
templates:
  - templates/base.yaml
release:
  name: my-release
set:
  image.repository: example.com/app
  image.tag: "1.2.3"
  service.enabled: false

tests:
  - it: should render nothing by default
    asserts:
      - hasDocuments:
          count: 1

  - it: should pull a named key from a secret store
    set:
      externalSecrets:
        - name: app-secret
          secretStoreRef:
            name: gcp-store
            kind: ClusterSecretStore
          data:
            - secretKey: API_KEY
              remoteRef:
                key: prod/app/api-key
    asserts:
      - isKind:
          of: ExternalSecret
        documentSelector:
          path: kind
          value: ExternalSecret
      - equal:
          path: spec.secretStoreRef
          value:
            name: gcp-store
            kind: ClusterSecretStore
        documentSelector:
          path: kind
          value: ExternalSecret
      - equal:
          path: spec.data[0].remoteRef.key
          value: prod/app/api-key
        documentSelector:
          path: kind
          value: ExternalSecret

  - it: should default the target secret name to the resource name
    set:
      externalSecrets:
        - name: app-secret
          secretStoreRef:
            name: gcp-store
          data:
            - secretKey: API_KEY
              remoteRef:
                key: prod/app/api-key
    asserts:
      - equal:
          path: spec.target.name
          value: app-secret
        documentSelector:
          path: kind
          value: ExternalSecret
      - equal:
          path: spec.secretStoreRef.kind
          value: SecretStore
        documentSelector:
          path: kind
          value: ExternalSecret
      - equal:
          path: spec.refreshInterval
          value: 1h
        documentSelector:
          path: kind
          value: ExternalSecret

  - it: should support dataFrom for whole-secret extraction
    set:
      externalSecrets:
        - name: app-secret
          refreshInterval: 15m
          secretStoreRef:
            name: gcp-store
          dataFrom:
            - extract:
                key: prod/app
    asserts:
      - equal:
          path: spec.dataFrom[0].extract.key
          value: prod/app
        documentSelector:
          path: kind
          value: ExternalSecret
      - equal:
          path: spec.refreshInterval
          value: 15m
        documentSelector:
          path: kind
          value: ExternalSecret

  - it: should feed a container env var from an external secret
    set:
      externalSecrets:
        - name: app-secret
          secretStoreRef:
            name: gcp-store
          data:
            - secretKey: API_KEY
              remoteRef:
                key: prod/app/api-key
      environment:
        secretVariables:
          API_KEY:
            name: app-secret
            key: API_KEY
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_KEY
            valueFrom:
              secretKeyRef:
                name: app-secret
                key: API_KEY
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.target.name
          value: app-secret
        documentSelector:
          path: kind
          value: ExternalSecret
