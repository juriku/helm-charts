suite: security context presets
templates:
  - templates/base.yaml
release:
  name: my-release
set:
  image.repository: example.com/app
  image.tag: "1.2.3"
  service.enabled: false

tests:
  - it: should set no security context by default
    asserts:
      - notExists:
          path: spec.template.spec.securityContext
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.spec.containers[0].securityContext
        documentSelector:
          path: kind
          value: Deployment

  - it: should apply the restricted profile when asked
    set:
      securityPreset: restricted
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        documentSelector:
          path: kind
          value: Deployment

  - it: should let explicit values win over the preset
    set:
      securityPreset: restricted
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: true
      podSecurityContext:
        fsGroup: 2000
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: true
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 2000
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
        documentSelector:
          path: kind
          value: Deployment

  - it: should apply the preset to extra containers too
    set:
      securityPreset: restricted
      extraContainers:
        - name: sidecar
          securityPreset: restricted
          image:
            tag: "1.0.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[1].securityContext.allowPrivilegeEscalation
          value: false
        documentSelector:
          path: kind
          value: Deployment

  - it: should apply the preset to init containers
    set:
      securityPreset: restricted
      initContainers:
        - name: migrate
          securityPreset: restricted
          image:
            tag: "1.0.0"
          command: ["migrate"]
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.drop
          value:
            - ALL
        documentSelector:
          path: kind
          value: Deployment

  - it: should satisfy every restricted Pod Security Standard control
    set:
      securityPreset: restricted
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
        documentSelector:
          path: kind
          value: Deployment

  - it: should never set privileged or allow host namespaces via the preset
    set:
      securityPreset: restricted
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].securityContext.privileged
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.spec.hostNetwork
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.spec.hostPID
        documentSelector:
          path: kind
          value: Deployment

  - it: should allow adding a capability back on top of the preset
    set:
      securityPreset: restricted
      securityContext:
        capabilities:
          drop:
            - ALL
          add:
            - NET_BIND_SERVICE
    asserts:
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          content: NET_BIND_SERVICE
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
        documentSelector:
          path: kind
          value: Deployment

  - it: should allow running as a specific non-root uid with the preset
    set:
      securityPreset: restricted
      podSecurityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
        documentSelector:
          path: kind
          value: Deployment

  - it: should let an explicit seccomp profile override the preset
    set:
      securityPreset: restricted
      podSecurityContext:
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/audit.json
    asserts:
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: Localhost
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.localhostProfile
          value: profiles/audit.json
        documentSelector:
          path: kind
          value: Deployment

  - it: should apply the preset to a StatefulSet workload
    set:
      securityPreset: restricted
      statefulSet: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
        documentSelector:
          path: kind
          value: StatefulSet

  - it: should reject an unknown preset name
    set:
      securityPreset: hardened
    asserts:
      - failedTemplate:
          errorPattern: securityPreset

  - it: should keep explicit security context working without a preset
    set:
      securityContext:
        readOnlyRootFilesystem: true
        runAsUser: 1000
      podSecurityContext:
        fsGroup: 2000
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            readOnlyRootFilesystem: true
            runAsUser: 1000
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 2000
        documentSelector:
          path: kind
          value: Deployment
